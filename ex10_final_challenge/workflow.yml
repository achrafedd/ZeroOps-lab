name: workflow
on: [push, pull_request]
branches: [main]

jobs:
  workflow:
    env:
      PROJECT_NAME: "ZeroOps Production"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: echo "final pipeline success message"

